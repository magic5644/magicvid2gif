name: Build, Package, Test and Publish Extension

on:
  push:
    branches:
      - main
      - 'releases/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test on ${{ matrix.os }} / VS Code ${{ matrix.vscode-version }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode-version: '1.96.0'
          - os: ubuntu-latest
            vscode-version: stable
          - os: windows-latest
            vscode-version: stable
          - os: macos-latest
            vscode-version: stable

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Bundle
        run: npm run bundle

      - name: Unit tests
        run: npm run test:unit

      - name: VS Code integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- --vscode-version ${{ matrix.vscode-version }}

      - name: VS Code integration tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e -- --vscode-version ${{ matrix.vscode-version }}

  package:
    name: Package VSIX
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package:vsix

      - name: Verify VSIX content
        run: npm run package:verify

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicvid2gif-vsix
          path: 'magicvid2gif-*.vsix'
          if-no-files-found: error

  publish:
    name: Publish
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.x'
          cache: npm

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package:vsix -- --out magicvid2gif-${{ steps.get_version.outputs.VERSION }}.vsix

      - name: Verify VSIX content
        run: npm run package:verify -- magicvid2gif-${{ steps.get_version.outputs.VERSION }}.vsix

      - name: Upload VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicvid2gif
          path: 'magicvid2gif-*.vsix'
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:vsce -- -p "$VSCE_PAT" --packagePath magicvid2gif-${{ steps.get_version.outputs.VERSION }}.vsix

      - name: Publish to Open VSX Marketplace
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:open-vsx -- -p "$OVSX_PAT" --packagePath magicvid2gif-${{ steps.get_version.outputs.VERSION }}.vsix

      - name: Publish artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'magicvid2gif-*.vsix'
          name: v${{ steps.get_version.outputs.VERSION }}
          body: Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
